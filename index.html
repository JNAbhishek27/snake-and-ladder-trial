<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snakes and Ladders</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>Snakes &amp; Ladders</h1>
        <p>Roll the die, climb ladders, avoid snakes. First to 100 wins.</p>
      </header>

      <main class="layout">
        <section class="board-wrap" aria-label="Game board">
          <div id="board" class="board"></div>
          <svg id="paths" class="paths" aria-hidden="true"></svg>
        </section>

        <aside class="panel">
          <div class="mode">
            <label>
              <input type="radio" name="mode" value="cpu" checked />
              You vs Computer
            </label>
            <label>
              <input type="radio" name="mode" value="hotseat" />
              Two players
            </label>
          </div>

          <div class="players">
            <div class="player-card" id="card-0">
              <span class="token token--p1" aria-hidden="true"></span>
              <div>
                <strong id="name-0">You</strong>
                <p>Square <span id="pos-0">0</span></p>
              </div>
            </div>
            <div class="player-card" id="card-1">
              <span class="token token--p2" aria-hidden="true"></span>
              <div>
                <strong id="name-1">Computer</strong>
                <p>Square <span id="pos-1">0</span></p>
              </div>
            </div>
          </div>

          <div class="dice-area">
            <button id="roll" class="dice" type="button" aria-label="Roll die">
              <span id="pips" class="pips" data-value="1"></span>
            </button>
            <p id="turn-label" class="turn-label">Your turn — click the die</p>
          </div>

          <ul id="log" class="log" aria-live="polite"></ul>

          <button id="reset" class="reset" type="button">New game</button>
        </aside>
      </main>

      <div id="win" class="win hidden" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="win-card">
          <h2 id="win-title">You win!</h2>
          <button id="play-again" type="button">Play again</button>
        </div>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
